apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-dep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: satellite-app
  
  template:
    metadata:
      name: satellite-dep
    spec:
      containers: 
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80