apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis-pod
  labels:
    app: genesis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genesis
  template:
    metadata:
      labels:
        app: genesis
    spec:
      containers:
      - name: web-container
        image: nginx:alpine
        ports:
        - containerPort: 80
