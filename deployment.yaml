apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: genesis
  template:
    metadata:
      labels:
        app: genesis
    spec:
      containers:
        - name: web-container
          image: nginx:alpine
          ports: 
            - containerPort: 80

      

